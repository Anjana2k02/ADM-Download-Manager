<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Send to ADM</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="mark">↓</span><strong>ADM</strong></header><h1>A home for your downloads.</h1><p>Send a direct file link to ADM. You’ll choose where to save it in the app.</p><label for="url">DOWNLOAD URL</label><textarea id="url" rows="3" placeholder="https://example.com/file.zip" spellcheck="false"></textarea><button id="send">Open in ADM ↗</button><p id="status" role="status"></p><footer>Or right-click a link → Download link with ADM.</footer><script src="popup.js"></script></body></html>
